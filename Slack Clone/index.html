<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <div class="left">
        <div class="logo">
          <img
            src="https://a.slack-edge.com/38f0e7c/marketing/img/nav/slack-salesforce-logo-nav-black@2x.png"
            alt=""
          />
        </div>
        <ul class="nav-links">
          <li>
            <a href="#"
              >Features <span><i class="ri-arrow-down-s-line"></i></span
            ></a>
          </li>
          <li>
            <a href="#"
              >Solutions <span><i class="ri-arrow-down-s-line"></i></span
            ></a>
          </li>
          <li><a href="#">Enterprise</a></li>
          <li>
            <a href="#"
              >Resources <span><i class="ri-arrow-down-s-line"></i></span
            ></a>
          </li>
          <li><a href="#">Pricing</a></li>
        </ul>
      </div>

      <div class="right">
        <div class="search">
          <i class="ri-search-line"></i>
        </div>
        <div class="sign-in-btn">
          <button>Sign in</button>
        </div>
        <button class="btn1">Request a demo</button>
        <button class="btn2">Get Started</button>
        <div class="menu">
          <i class="ri-menu-line"></i>
        </div>
      </div>
    </nav>

    <section class="section1">
      <div class="first">
        <h1>Slack is your team's collective 🧠 brain.</h1>
        <p>
          Move faster and work smarter, with people, apps, and AI at your side.
        </p>
        <div class="btns">
          <button class="btn1">Get started</button>
          <button class="btn2">
            Find your plan <i class="ri-arrow-right-long-line"></i>
          </button>
        </div>
        <div class="teams">
          <h3>Trusted by top teams</h3>
          <div class="teams-logo">
            <div>
              <img
                src="https://a.slack-edge.com/84f9021/marketing/img/homepage/true-prospects/hero-revamp/logos/logo-gm-small@2x.png"
              />
            </div>
            <div>
              <img
                src="https://a.slack-edge.com/84f9021/marketing/img/homepage/true-prospects/hero-revamp/logos/logo-openai-small@2x.png"
              />
            </div>
            <div>
              <img
                src="https://a.slack-edge.com/a4c4a15/marketing/img/homepage/true-prospects/revamp-exp/logos/logo-target-small@2x.png"
              />
            </div>
            <div>
              <img
                src="https://a.slack-edge.com/84f9021/marketing/img/homepage/true-prospects/hero-revamp/logos/logo-paramount-small@2x.png"
              />
            </div>
            <div>
                <img src="https://a.slack-edge.com/84f9021/marketing/img/homepage/true-prospects/hero-revamp/logos/logo-stripe-small@2x.png">
            </div>
            <div>
              <img
                src="https://a.slack-edge.com/84f9021/marketing/img/homepage/true-prospects/hero-revamp/logos/logo-ibm-small@2x.png"
              />
            </div>
          </div>
        </div>
      </div>

      <div class="second">
        <h2>Plan launches</h2>
        <div class="video">
          <video
            autoplay
            muted
            loop
            src="https://a.slack-edge.com/5cb5052/marketing/img/homepage/revamped-25/hero/hp-workflows@2x.mp4"
          ></video>
        </div>
        <div class="video-btns">
          <div>Plan launches</div>
          <div>Run Projects</div>
          <div>Chat with client</div>
          <div>Ask an agent</div>
          <div>Automate tasks</div>
        </div>
        <div class="circles">
            <div id="active" class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
      </div>
    </section>
  </body>
</html>
